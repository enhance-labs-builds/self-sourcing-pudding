schema_version = 1
product = "A tool that makes preview deployments reliable for software teams."
problem = "Preview environments fail or take too long to spin up, so changes pile up before review."
target_roles = ["Platform Engineer", "Developer Experience", "DevOps", "Infrastructure Engineer"]

# Search terms help decide what to open. A hit still needs a fit decision.
signals = ["preview deploy", "preview environments", "staging bottleneck", "preview build"]
alternatives = ["BranchDock", "SandboxLane", "deploy script", "shared staging"]
exclusions = ["vendor announcements", "generic praise", "coworker or employer fit alone"]
qualifies = "The person's own account shows they do or own work on preview environments at a software team."
more_like = "An engineer who describes debugging their team's failed preview deploys or building a replacement."
less_like = "A platform engineer who comments on a tool launch without describing their own work."

[limits]
source_age_days = 30
role_age_days = 90
shortlist_size = 10

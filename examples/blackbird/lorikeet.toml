schema_version = 1
# Source: https://www.blackbird.vc/blog/investment-notes-lorikeet
# Source: https://www.lorikeetcx.ai/product
# Source: https://www.intercom.com/fin
product = "Lorikeet provides AI customer support agents for complex workflows such as refunds, disputes and account changes. https://www.lorikeetcx.ai/"
problem = "CX teams need to resolve requests that span systems and require policies, handoffs or account actions, beyond just answering FAQs."
target_roles = ["Head of CX", "Customer Experience", "Head of Support", "VP Support", "Support Operations", "Customer Operations", "AI Product Lead", "CX Automation"]
signals = ["AI customer support", "support automation", "customer support AI", "AI support agent", "support workflows"]
alternatives = ["Intercom Fin", "Sierra", "Decagon", "Zendesk AI"]
exclusions = ["Lorikeet staff", "confirmed Lorikeet customers", "support automation vendors selling their product", "news and investor commentary", "bird posts"]
qualifies = "A support, customer operations or product leader describes owning a real customer support AI rollout or evaluating tooling to automate multistep support work. Prefer evidence of policy-sensitive actions, volume, handoffs or a concrete automation limit."
more_like = "A fintech support lead explains where its current support agent can resolve refund tickets and when it must hand off to a person."
less_like = "A vendor founder posts an AI customer service market map."

[[searches]]
lane = "alternative"
phrase = "Intercom"
workflow = ["customer support", "support automation", "support team"]

[[searches]]
lane = "alternative"
phrase = "Sierra"
workflow = ["customer support", "support automation", "support team"]
exclude_phrases = ["Tata Sierra", "Sierra Leone", "García Sierra", "Olivares Sierra"]

[[searches]]
lane = "account"
phrase = "Kalshi"
workflow = ["support volume", "support automation", "customer support"]
seed_url = "https://fin.ai/customers/kalshi"

[[searches]]
lane = "problem"
phrase = "support ticket backlog"

[[customer_stories]]
competitor = "Intercom Fin"
site = "https://fin.ai/customers"
workflow = "customer support"

[[customer_stories]]
competitor = "Sierra"
site = "https://sierra.ai/customers"
workflow = "customer support"

[limits]
source_age_days = 45
role_age_days = 30
shortlist_size = 3
